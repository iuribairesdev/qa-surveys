
<!-- templates/home.html -->
{% extends "base.html" %}

{% block content %}
  <h1 class="mt-4">QA Survey Automation</h1>
  
  
  <form action="{{ url_for('preview')}}" method="POST" enctype="multipart/form-data">
    <div class="mb-3">
      <div class="form-group">
        <label for="file" class="form-label"><b>Upload Survey</b>:</label>
        <input type="file" name="file" class="form-control" multiple>
	    </div>
    </div>   
    <div class="mb-3">
      <label><b>Or select a file from Google Drive </b>:</label><br>
      <input type="hidden" name="google_drive_file_id" id="google_drive_file_id">
      <button type="button" id="pick-from-drive" class="btn btn-outline-primary">Pick from Drive</button>
      <div id="drive_file_name" style="margin-top: 10px;"></div>
    </div>
    


    <div class="mb-3">
      <div class="form-group">
        <label for="prompt_id" class="form-label"><br><b>Select a Prompt Template</b></label>
        <select class="form-control" id="prompt_id" name="prompt_id" required>
            <option value="" disabled selected>No prompt selected...</option>
            {% for prompt in prompts %}
                <option value="{{ prompt.id }}" data-title="{{ prompt.title}}">{{ prompt.title }}</option>
            {% endfor %}
        </select>
        <br>
        <span class="helper-text">[i]&nbsp;</span><span>Select the prompt to be used for processing.</span>
      </div>
    </div>
   
    <div class="mb-3" id="model_group" style="display: none;">
      <div class="form-group" >
        <label for="model" class="form-label"><br><b>Model:</b></label>
        <select class="form-control" id="model" name="model" required>
          <!-- Add options for the models, with one of them being the current setting -->
          <option value="o1-2024-12-17">GPTo1</option>
          <option value="o1-mini-2024-09-12">GPTo1-mini</option>
          <option value="gpt-4o" selected>GPT4o</option>
          <option value="gpt-4o-mini">GPT-4o Mini</option>
          <option value="gpt4">GPT-4</option>
          <option value="gpt-3.5-turbo">gpt-3.5-turbo</option>
          <option value="dall-e-3">Dall-e-3"</option>
        </select>
        <br>
        <span class="helper-text">[i]&nbsp;</span><span>Select the model used for processing. Each model has different capabilities.</span>
        <a href="https://platform.openai.com/docs/models">https://platform.openai.com/docs/models</a>
      </div>
    </div>
    
    <button type="submit" class="btn btn-primary">Submit</button>
  </form>

  <script nonce="{{ nonce }}">
    $(document).ready(function () {

      const promptSelect = document.getElementById("prompt_id");
      const modelGroup = document.getElementById("model_group");

      function checkPrompt() {
        const selectedOption = promptSelect.options[promptSelect.selectedIndex];
        const title = selectedOption ? selectedOption.dataset.title : "";
        if (title === "Categorization")  {
          modelGroup.style.display = "none";
        } else {
          modelGroup.style.display = "block";
        }
      }
  
      // Initial check
      //checkPrompt();
  
      // On change
      $('#prompt_id').on('change', checkPrompt);
    });
  </script>

<script nonce="{{ nonce }}">
  const GOOGLE_CLIENT_ID = '{{ GOOGLE_CLIENT_ID }}';  // Injected from Flask
  const DEVELOPER_KEY = '{{ GOOGLE_DEVELOPER_KEY }}';
  const APP_ID = '{{ GOOGLE_APP_ID }}';  // Found in Google Cloud console
  
  //alert(DEVELOPER_KEY);
  let tokenClient;
  let accessToken = null;

  function initializeGapiClient() {
    //gapi.load('client:picker', onAuthApiLoad);
    gapi.load('client:auth2:picker', onAuthApiLoad);

  }
  
  function onAuthApiLoad() {
    if (!GOOGLE_CLIENT_ID) {
        console.error("GOOGLE_CLIENT_ID is missing!");
        return;
    }

    if (typeof google === 'undefined') {
        console.error("Google API is not ready yet.");
        return;
    }
    if (typeof gapi === 'undefined') {
        console.error("GAPI client is not ready yet.");
        return;
    }

    tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: GOOGLE_CLIENT_ID,
        scope: 'https://www.googleapis.com/auth/drive.file',
        callback: (tokenResponse) => {
            if (tokenResponse.error) {
                console.error('Error obtaining access token:', tokenResponse);
                return;
            }

            accessToken = tokenResponse.access_token;
            console.log('Successfully obtained access token:', accessToken);

            // Now call the function that initializes your Picker or Drive logic
            onAccessTokenReceived();
        }
    });

    // Now trigger the flow: request an access token from the user
    requestAccessToken();
  }

  function handleAuthResult(authResult) {
    if (authResult && !authResult.error) {
      oauthToken = authResult.access_token;
      createPicker();
    } else {
      console.error('Auth failed:', authResult.error);
    }
  }

  function requestAccessToken() {
    if (!tokenClient) {
        console.error('Token client is not initialized.');
        return;
    }
    tokenClient.requestAccessToken();
  }

  function onAccessTokenReceived() {
      // Example usage: initialize the Google Picker
      if (accessToken) {
          console.log('Ready to use the access token.');
          loadPicker();
      } else {
          console.error('Access token is not available.');
      }
  }

  function loadPicker() {
    // alert(tokenClient);
    // alert(accessToken)
      const picker = new google.picker.PickerBuilder()
          .setOAuthToken(tokenClient)
          .setDeveloperKey(DEVELOPER_KEY)
          .setAppId(APP_ID)
          .addView(google.picker.ViewId.DOCS)
          .setCallback(pickerCallback)
          .build();
      picker.setVisible(true);
  }

  function pickerCallback(data) {
      if (data.action === google.picker.Action.PICKED) {
          const file = data.docs[0];
          console.log('Picked file:', file);
          // Proceed with whatever you want to do with the file
      }
  }

  

  document.addEventListener('DOMContentLoaded', function() {
    document.getElementById('pick-from-drive').addEventListener('click', function() {
      initializeGapiClient();
      requestAccessToken();
    });
  });
  //function onPickerButtonClicked() {
    //onApiLoad();
  //}
</script>


{% endblock %}
