<!-- templates/home.html -->
{% extends "base.html" %}

{% block content %}
  <h1 class="mt-4">QA Survey Automation</h1>
  
  
  <form action="{{ url_for('preview')}}" method="POST" enctype="multipart/form-data">
    <div class="mb-3">
      <div class="form-group">
        <label for="file" class="form-label"><b>Upload Survey</b>:</label>
        <input type="file" name="file" class="form-control" multiple>
	    </div>
    </div>   
    <div class="mb-3">
      <label><b>Or select a file from Google Drive </b>:</label><br>
      <input type="hidden" name="drive_file_id" id="drive_file_id">
      <button type="button" id="pick-btn">Pick from Google Drive</button>
    </div>
    


    <div class="mb-3">
      <div class="form-group">
        <label for="prompt_id" class="form-label"><br><b>Select a Prompt Template</b></label>
        <select class="form-control" id="prompt_id" name="prompt_id" required>
            <option value="" disabled selected>No prompt selected...</option>
            {% for prompt in prompts %}
                <option value="{{ prompt.id }}" data-title="{{ prompt.title}}">{{ prompt.title }}</option>
            {% endfor %}
        </select>
        <br>
        <span class="helper-text">[i]&nbsp;</span><span>Select the prompt to be used for processing.</span>
      </div>
    </div>
   
    <div class="mb-3" id="model_group" style="display: none;">
      <div class="form-group" >
        <label for="model" class="form-label"><br><b>Model:</b></label>
        <select class="form-control" id="model" name="model" required>
          <!-- Add options for the models, with one of them being the current setting -->
          <option value="o1-2024-12-17">GPTo1</option>
          <option value="o1-mini-2024-09-12">GPTo1-mini</option>
          <option value="gpt-4o" selected>GPT4o</option>
          <option value="gpt-4o-mini">GPT-4o Mini</option>
          <option value="gpt4">GPT-4</option>
          <option value="gpt-3.5-turbo">gpt-3.5-turbo</option>
          <option value="dall-e-3">Dall-e-3"</option>
        </select>
        <br>
        <span class="helper-text">[i]&nbsp;</span><span>Select the model used for processing. Each model has different capabilities.</span>
        <a href="https://platform.openai.com/docs/models">https://platform.openai.com/docs/models</a>
      </div>
    </div>
    
    <button type="submit" class="btn btn-primary">Submit</button>
  </form>

  <script nonce="{{ nonce }}">
    $(document).ready(function () {

      const promptSelect = document.getElementById("prompt_id");
      const modelGroup = document.getElementById("model_group");

      function checkPrompt() {
        const selectedOption = promptSelect.options[promptSelect.selectedIndex];
        const title = selectedOption ? selectedOption.dataset.title : "";
        if (title === "Categorization")  {
          modelGroup.style.display = "none";
        } else {
          modelGroup.style.display = "block";
        }
      }
  
      // On change
      $('#prompt_id').on('change', checkPrompt);
    });
  </script>


  <script nonce="{{ nonce }}">
    const CLIENT_ID = '{{ GOOGLE_CLIENT_ID }}';  // Injected from Flask
    const DEVELOPER_KEY = '{{ GOOGLE_DEVELOPER_KEY }}';
    const APP_ID = '{{ GOOGLE_APP_ID }}';  // Found in Google Cloud console
    const SCOPE = ['https://www.googleapis.com/auth/drive.readonly'];

    let oauthToken;

    function onApiLoad() {
      gapi.load('auth', {'callback': onAuthApiLoad});
      gapi.load('picker');
    }

    function onAuthApiLoad() {
      gapi.auth.authorize(
        {
          client_id: CLIENT_ID,
          scope: SCOPE,
          immediate: false
        },
        handleAuthResult
      );
    }

    function handleAuthResult(authResult) {
      if (authResult && !authResult.error) {
        oauthToken = authResult.access_token;
        createPicker();
      } else {
        console.error("Auth failed:", authResult.error);
      }
    }

    function createPicker() {
      if (oauthToken) {
        const picker = new google.picker.PickerBuilder()
          .addView(google.picker.ViewId.DOCS)
          .setOAuthToken(oauthToken)
          .setDeveloperKey(DEVELOPER_KEY)
          .setCallback(pickerCallback)
          .build();
        picker.setVisible(true);
      }
    }

    function pickerCallback(data) {
      if (data.action === google.picker.Action.PICKED) {
        const fileId = data.docs[0].id;
        document.getElementById('drive_file_id').value = fileId;
      }
    }



    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('pick-btn').addEventListener('click', () => {
        gapi.load('auth', { 'callback': onAuthApiLoad });
        gapi.load('picker');
      });
    });
  </script>
{% endblock %}
